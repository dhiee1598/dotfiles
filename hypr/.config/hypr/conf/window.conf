# ----------------------------------------------------- 
# General window layout and colors
# ----------------------------------------------------- 

$blue = 7dd3fc
$teal = 5eead4
$magenta = f0abfc
$inactive-color = 23293a


general {
    gaps_in = 5
    gaps_out = 14
    border_size = 2
    col.active_border = rgb($blue) rgb($teal) rgb($magenta) 45deg
    col.inactive_border = rgb($inactive-color)
    layout = dwindle
    resize_on_border = true
}
