# ----------------------------------------------------- 
# Autostart
# ----------------------------------------------------- 

# Start Polkit
exec-once = waybar & hyprpaper & swaync & hypridle & swayosd-server
exec-once=dbus-update-activation-environment --systemd --all
# graphical-session.target never activates under plain Hyprland, so the portal
# frontend never starts -> libadwaita apps (Files/nautilus, Disk Analyzer) ignore
# color-scheme and render light. Launch the frontend directly so prefer-dark applies.
exec-once=sleep 1 && /usr/lib/xdg-desktop-portal -r
exec-once=gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

