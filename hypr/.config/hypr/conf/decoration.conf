# ----------------------------------------------------- 
# General window decoration
# ----------------------------------------------------- 

decoration {
    rounding = 14
    active_opacity = 0.98
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = on
        ignore_opacity = false
        xray = false
        contrast = 1.08
        brightness = 0.92
        vibrancy = 0.22
        vibrancy_darkness = 0.18
    }

    shadow {
        enabled = true
        range = 38
        render_power = 4
        color = 0x7a000000
        color_inactive = 0x42000000
    }
}
