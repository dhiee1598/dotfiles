# Configuration

font_family                 FiraCode Nerd Font
font_size                   11
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        700
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        12
hide_window_decorations     yes
background_opacity          0.88
dynamic_background_opacity  yes
confirm_os_window_close     0
shell                       zsh
allow_remote_control        yes
listen_on                   unix:/tmp/mykitty
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_edge                top
active_tab_font_style       bold
inactive_tab_font_style     normal
window_border_width         1pt
active_border_color         #00c2df
inactive_border_color       #031116

# Wallpaper-matched dark terminal palette
background              #000507
foreground              #d9f7fb
selection_foreground    #d9f7fb
selection_background    #05222a
cursor                  #00c2df
cursor_text_color       #000507
url_color               #00e5ff
active_tab_background   #05222a
active_tab_foreground   #d9f7fb
inactive_tab_background #031116
inactive_tab_foreground #6f9299

