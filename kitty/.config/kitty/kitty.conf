# Configuration

font_family                 FiraCode Nerd Font
font_size                   11
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        700
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        12
hide_window_decorations     yes
background_opacity          0.88
dynamic_background_opacity  yes
confirm_os_window_close     0
shell                       zsh
allow_remote_control        yes
listen_on                   unix:/tmp/mykitty
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_edge                top
active_tab_font_style       bold
inactive_tab_font_style     normal
window_border_width         1pt
active_border_color         #22d3ee
inactive_border_color       #08242b

# Waybar-matched dark terminal palette
background              #031014
foreground              #d6faff
selection_foreground    #d6faff
selection_background    #0d3440
cursor                  #22d3ee
cursor_text_color       #031014
url_color               #67e8f9
active_tab_background   #0d3440
active_tab_foreground   #d6faff
inactive_tab_background #08242b
inactive_tab_foreground #7aa4ad

