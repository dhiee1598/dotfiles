# Configuration

font_family                 FiraCode Nerd Font
font_size                   11
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        700
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        12
hide_window_decorations     yes
background_opacity          0.88
dynamic_background_opacity  yes
confirm_os_window_close     0
shell                       zsh
allow_remote_control        yes
listen_on                   unix:/tmp/mykitty
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_edge                top
active_tab_font_style       bold
inactive_tab_font_style     normal
window_border_width         1pt
active_border_color         #7dd3fc
inactive_border_color       #181c27

# Waybar-matched floating glass palette
background              #0a0c12
foreground              #e8edf7
selection_foreground    #e8edf7
selection_background    #23293a
cursor                  #7dd3fc
cursor_text_color       #0a0c12
url_color               #5eead4
active_tab_background   #2a3044
active_tab_foreground   #e8edf7
inactive_tab_background #181c27
inactive_tab_foreground #8992a7

