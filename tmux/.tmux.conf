unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -g prefix C-s
set -g mouse on
set -g base-index 1

set-option -g status-position top
set-option -g renumber-windows on
set -ag terminal-overrides ",xterm-256color:RGB"
set -g pane-border-style "fg=#0d3440"
set -g pane-active-border-style "fg=#22d3ee"
set -g status-style "bg=#031014,fg=#d6faff"
set -g message-style "bg=#0d3440,fg=#22d3ee"
set -g mode-style "bg=#0d3440,fg=#d6faff"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-resurrect'

### Tokyo Night Theme configuration
set -g @theme_variation 'night'
set -g @theme_left_separator ''
set -g @theme_right_separator ''
set -g @theme_plugins 'datetime,weather,yay'
set -g @theme_transparent_status_bar 'true'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
